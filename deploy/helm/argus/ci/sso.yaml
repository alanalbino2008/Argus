# CI render check: single sign-on through an ingress with TLS.
sso:
  enabled: true
  issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
  clientId: argus
  displayName: Microsoft
  requireVerifiedEmail: false
  allowedDomains: [acme.example]
  adminGroups: [argus-admins]
ingress:
  enabled: true
  host: argus.acme.example
  tls: {enabled: true}
secrets:
  oidcClientSecret: ci-oidc-secret
networkPolicy:
  internalEgress: [{cidr: 10.30.0.0/24, port: 8443}]
