apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argus.fullname" . }}
  labels: {{- include "argus.labels" . | nindent 4 }}
data:
  ARGUS_AUTO_MIGRATE: "false"
  ARGUS_MAX_CONCURRENT_SCANS: {{ .Values.config.maxConcurrentScans | quote }}
  ARGUS_SCANS_PER_MINUTE: {{ .Values.config.scansPerMinute | quote }}
  ARGUS_API_REQUESTS_PER_MINUTE: {{ .Values.config.apiRequestsPerMinute | quote }}
  ARGUS_MONITORS_ENABLED: {{ .Values.config.monitorsEnabled | quote }}
  ARGUS_EXPOSURE_MONITORING_ENABLED: {{ .Values.config.exposureMonitoring | quote }}
  ARGUS_RANSOMWARE_FEED_URL: {{ .Values.config.ransomwareFeedUrl | quote }}
  ARGUS_EGRESS_CHECK_URL: {{ .Values.config.egressCheckUrl | quote }}
  ARGUS_USERNAME_CATALOG_URL: {{ .Values.config.usernameCatalogUrl | quote }}
  ARGUS_ACCOUNT_WATCH_ENABLED: {{ .Values.config.accountWatching | quote }}
  ARGUS_MAP_TILE_URL: {{ .Values.config.mapTileUrl | quote }}
  ARGUS_GEOCODER_URL: {{ .Values.config.geocoderUrl | quote }}
  ARGUS_BITCOIN_API_URL: {{ .Values.config.bitcoinApiUrl | quote }}
  ARGUS_EVM_CHAINS: {{ .Values.config.evmChains | toJson | quote }}
  ARGUS_SANCTIONS_SDN_URL: {{ .Values.config.sanctionsSdnUrl | quote }}
  ARGUS_UK_SANCTIONS_URL: {{ .Values.config.ukSanctionsUrl | quote }}
  ARGUS_UN_SANCTIONS_URL: {{ .Values.config.unSanctionsUrl | quote }}
  ARGUS_SEC_USER_AGENT: {{ .Values.config.secUserAgent | quote }}
  ARGUS_ACCOUNT_SERVICE_ENABLED: {{ .Values.config.accountService | quote }}
  ARGUS_ACCOUNT_SIGNUP_ENABLED: {{ .Values.config.accountSignup | quote }}
  ARGUS_TRIAL_DAYS: {{ .Values.config.trialDays | quote }}
  ARGUS_LICENCE_OFFLINE_DAYS: {{ .Values.config.licenceOfflineDays | quote }}
  ARGUS_STRIPE_PRICE_PERSONAL: {{ .Values.config.stripePricePersonal | default "" | quote }}
  ARGUS_STRIPE_PRICE_PROFESSIONAL: {{ .Values.config.stripePriceProfessional | default "" | quote }}
  ARGUS_STRIPE_PRICE_BYOK: {{ .Values.config.stripePriceByok | default "" | quote }}
  ARGUS_STRIPE_PRICE_BUSINESS: {{ .Values.config.stripePriceBusiness | default "" | quote }}
  ARGUS_STRIPE_PRICE_BUSINESS_SETUP: {{ .Values.config.stripePriceBusinessSetup | default "" | quote }}
  ARGUS_STRIPE_CREDIT_PACKS: {{ .Values.config.stripeCreditPacks | default "" | quote }}
  ARGUS_BILLING_RETURN_URL: {{ .Values.config.billingReturnUrl | default "" | quote }}
  ARGUS_ACCOUNT_EMAILS_ENABLED: {{ .Values.config.accountEmails | default true | quote }}
  ARGUS_ACCOUNT_EMAIL_FROM: {{ .Values.config.accountEmailFrom | default "" | quote }}
  ARGUS_SUPPORT_EMAIL: {{ .Values.config.supportEmail | default "" | quote }}
  ARGUS_NOTIFICATIONS_ENABLED: {{ .Values.notifications.enabled | quote }}
  ARGUS_NOTIFY_MAX_ATTEMPTS: {{ .Values.notifications.maxAttempts | quote }}
  ARGUS_REPORT_SCHEDULES_ENABLED: {{ .Values.notifications.scheduledReports | quote }}
  {{- with .Values.notifications.integrationAllowedHosts }}
  ARGUS_INTEGRATION_ALLOWED_HOSTS: {{ toJson . | quote }}
  {{- end }}
  {{- with .Values.notifications.smtp }}
  {{- if .host }}
  ARGUS_SMTP_HOST: {{ .host | quote }}
  ARGUS_SMTP_PORT: {{ .port | quote }}
  ARGUS_SMTP_SECURITY: {{ .security | quote }}
  {{- with .username }}
  ARGUS_SMTP_USERNAME: {{ . | quote }}
  {{- end }}
  ARGUS_SMTP_FROM: {{ required "notifications.smtp.from is required when notifications.smtp.host is set" .from | quote }}
  {{- end }}
  {{- end }}
  ARGUS_SCAN_STALE_SECONDS: {{ .Values.config.scanStaleSeconds | quote }}
  ARGUS_ALLOW_PRIVATE_TARGETS: {{ .Values.config.allowPrivateTargets | quote }}
  ARGUS_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  ARGUS_LOG_LEVEL: {{ .Values.config.logLevel | upper | quote }}
  ARGUS_METRICS_ENABLED: {{ .Values.metrics.enabled | quote }}
  {{- with (include "argus.publicUrl" .) }}
  ARGUS_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.sso.enabled }}
  ARGUS_OIDC_ISSUER: {{ required "sso.issuer is required when sso.enabled" .Values.sso.issuer | quote }}
  ARGUS_OIDC_CLIENT_ID: {{ required "sso.clientId is required when sso.enabled" .Values.sso.clientId | quote }}
  ARGUS_OIDC_DISPLAY_NAME: {{ .Values.sso.displayName | quote }}
  ARGUS_OIDC_SCOPES: {{ .Values.sso.scopes | quote }}
  ARGUS_OIDC_ALLOWED_DOMAINS: {{ .Values.sso.allowedDomains | toJson | quote }}
  ARGUS_OIDC_REQUIRE_VERIFIED_EMAIL: {{ .Values.sso.requireVerifiedEmail | quote }}
  ARGUS_OIDC_ROLE_CLAIM: {{ .Values.sso.roleClaim | quote }}
  ARGUS_OIDC_ADMIN_GROUPS: {{ .Values.sso.adminGroups | toJson | quote }}
  ARGUS_OIDC_ANALYST_GROUPS: {{ .Values.sso.analystGroups | toJson | quote }}
  ARGUS_OIDC_VIEWER_GROUPS: {{ .Values.sso.viewerGroups | toJson | quote }}
  ARGUS_OIDC_DEFAULT_ROLE: {{ .Values.sso.defaultRole | quote }}
  ARGUS_OIDC_ADMIN_EMAILS: {{ .Values.sso.adminEmails | toJson | quote }}
  ARGUS_OIDC_DEFAULT_WORKSPACE: {{ .Values.sso.defaultWorkspace | quote }}
  ARGUS_OIDC_WORKSPACE_GROUPS: {{ .Values.sso.workspaceGroups | toJson | quote }}
  ARGUS_SESSION_TTL_HOURS: {{ .Values.sso.sessionTtlHours | quote }}
  {{- end }}
  ARGUS_CORS_ORIGINS: {{ .Values.config.corsOrigins | toJson | quote }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
