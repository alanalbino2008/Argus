{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus.fullname" . }}
  labels: {{- include "argus.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap-admin-key: {{ default (printf "argus_%s" (include "argus.persistentRandom" (list . "bootstrap-admin-key" 40) | trimPrefix "argus_")) .Values.secrets.bootstrapAdminKey | quote }}
  {{- if include "argus.bundledPostgres" . }}
  postgres-password: {{ default (include "argus.persistentRandom" (list . "postgres-password" 32)) .Values.postgresql.password | quote }}
  {{- end }}
  {{- with .Values.secrets.githubToken }}
  github-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.virustotalApiKey }}
  virustotal-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.hibpApiKey }}
  hibp-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  oidc-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  metrics-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.shodanApiKey }}
  shodan-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
