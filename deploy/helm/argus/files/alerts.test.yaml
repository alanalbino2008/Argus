# promtool unit tests for alerts.yaml:  promtool test rules alerts.test.yaml
rule_files: [alerts.yaml]
evaluation_interval: 1m

tests:
  - name: database outage pages after 2 minutes, not before
    interval: 1m
    input_series:
      - series: 'argus_database_up{instance="a"}'
        values: '1 0 0 0 0'
      - series: 'argus_database_up{instance="b"}'
        values: '1 1 1 1 1'
    alert_rule_test:
      - {eval_time: 2m, alertname: ArgusDatabaseUnreachable, exp_alerts: []}
      - eval_time: 4m
        alertname: ArgusDatabaseUnreachable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: Argus cannot reach PostgreSQL
              description: At least one replica's health check failed to query the database for 2 minutes; affected pods are out of the load balancer.
              runbook: Check database availability, credentials (database-url secret) and the NetworkPolicy databaseCIDRs.

  - name: 10% server errors for 10 minutes raises the error-rate alert
    interval: 1m
    input_series:
      - series: 'argus_http_requests_total{method="GET",route="/api/investigations",status="200"}'
        values: '0+90x20'
      - series: 'argus_http_requests_total{method="GET",route="/api/investigations",status="500"}'
        values: '0+10x20'
    alert_rule_test:
      - {eval_time: 5m, alertname: ArgusHighErrorRate, exp_alerts: []}
      - eval_time: 20m
        alertname: ArgusHighErrorRate
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: More than 5% of API requests fail
              description: 10% of API requests returned 5xx over the last 5 minutes.
              runbook: Search the JSON logs for level=error and correlate with request_id.

  - name: failing health probes during a database outage do not double-page as API errors
    interval: 1m
    input_series:
      - series: 'argus_http_requests_total{method="GET",route="/api/investigations",status="200"}'
        values: '0+50x20'
      - series: 'argus_http_requests_total{method="GET",route="/api/health",status="503"}'
        values: '0+30x20'
    alert_rule_test:
      - {eval_time: 20m, alertname: ArgusHighErrorRate, exp_alerts: []}

  - name: healthy traffic raises nothing
    interval: 1m
    input_series:
      - series: 'argus_http_requests_total{method="GET",route="/api/investigations",status="200"}'
        values: '0+100x20'
      - series: 'argus_build_info{version="1.12.0",replica="a"}'
        values: '1x20'
    alert_rule_test:
      - {eval_time: 20m, alertname: ArgusHighErrorRate, exp_alerts: []}
      - {eval_time: 20m, alertname: ArgusDown, exp_alerts: []}

  - name: an SSRF block is surfaced immediately
    interval: 1m
    input_series:
      - series: 'argus_outbound_requests_total{outcome="blocked"}'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: ArgusEgressBlocked
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: Argus refused to contact a private or metadata address
              description: The SSRF guard blocked an outbound request (e.g. a target redirecting to an internal address). Usually a hostile or misconfigured target - worth a look.
              runbook: Find the investigation in the JSON logs (outcome=blocked) and review its target.

  - name: a module tripping its breaker three times is flagged per module
    interval: 5m
    input_series:
      - series: 'argus_module_circuit_breaker_trips_total{module="passive_dns"}'
        values: '0 1 2 3'
      - series: 'argus_module_circuit_breaker_trips_total{module="wayback"}'
        values: '0 0 0 1'
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgusDataSourceDown
        exp_alerts:
          - exp_labels: {severity: warning, module: passive_dns}
            exp_annotations:
              summary: Collector passive_dns keeps tripping its circuit breaker
              description: The module was disabled mid-scan 3+ times in an hour - its upstream API is probably down, rate-limiting or has changed.
              runbook: Check the module's errors in recent investigations; verify API keys and quotas.

  - name: a notification that exhausted its retries is flagged per channel type
    interval: 1m
    input_series:
      - series: 'argus_notifications_total{channel_type="slack",outcome="failed",instance="a"}'
        values: '0 0 1 1'
      - series: 'argus_notifications_total{channel_type="webhook",outcome="delivered",instance="a"}'
        values: '0 5 10 15'
    alert_rule_test:
      - eval_time: 3m
        alertname: ArgusNotificationsFailing
        exp_alerts:
          - exp_labels: {severity: warning, channel_type: slack}
            exp_annotations:
              summary: Argus gave up delivering slack notifications
              description: Alerts were not delivered after every retry - people relying on this destination are not being told about attack-surface changes.
              runbook: Open Monitoring > Notifications in the affected workspace; the delivery log shows the error (revoked webhook, wrong URL, SMTP credentials). Fix it, then Retry.

  - name: a growing outbox pages after 15 minutes, not before
    interval: 1m
    input_series:
      - series: 'argus_notifications_pending{instance="a"}'
        values: '0 80x25'
      - series: 'argus_notifications_pending{instance="b"}'
        values: '0 80x25'
    alert_rule_test:
      - {eval_time: 10m, alertname: ArgusNotificationBacklog, exp_alerts: []}
      - eval_time: 20m
        alertname: ArgusNotificationBacklog
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Notifications are piling up
              description: "80 deliveries are waiting - a destination is down or the dispatcher is not running."
              runbook: Check the delivery log for the failing destination and that ARGUS_NOTIFICATIONS_ENABLED is true on at least one replica.

  - name: watches that only fail alert; a kind with any success does not
    interval: 30m
    input_series:
      - series: 'argus_watch_runs_total{kind="brand",status="error"}'
        values: '0+1x16'
      - series: 'argus_watch_runs_total{kind="fingerprint",status="error"}'
        values: '0+1x16'
      - series: 'argus_watch_runs_total{kind="fingerprint",status="ok"}'
        values: '0+1x16'
    alert_rule_test:
      - {eval_time: 30m, alertname: ArgusWatchesFailing, exp_alerts: []}
      - eval_time: 6h
        alertname: ArgusWatchesFailing
        exp_alerts:
          - exp_labels: {severity: warning, kind: brand}
            exp_annotations:
              summary: Every brand watch run failed for 6 hours
              description: brand watch runs keep failing and none succeeded - new lookalike domains or attacker servers are not being found.
              runbook: Open Monitoring > Brand watches (or Fingerprint watches); each watch shows its last error. Check the Shodan/Censys/Cert Spotter keys and that Argus can reach the source through its egress.

  - name: a watcher with no success for 2 days is stalled
    interval: 1m  # the "for" clause needs a sample every evaluation
    input_series:
      - series: 'argus_watch_last_success_timestamp_seconds{kind="brand",instance="a"}'
        values: '0x3100'
      - series: 'argus_watch_last_success_timestamp_seconds{kind="fingerprint",instance="a"}'
        values: '0+60x3100'
    alert_rule_test:
      - {eval_time: 47h, alertname: ArgusWatchesStalled, exp_alerts: []}
      - eval_time: 50h
        alertname: ArgusWatchesStalled
        exp_alerts:
          - exp_labels: {severity: warning, kind: brand}
            exp_annotations:
              summary: No brand watch has succeeded for 2 days
              description: No replica has finished a brand watch run successfully for 2 days - the watcher may have stopped.
              runbook: Check that monitoring is enabled for the plan and that the watcher loop is running (look for "watch tick failed" in the JSON logs).

  - name: a Certificate Transparency source failing repeatedly is reported
    interval: 30m
    input_series:
      - series: 'argus_watch_source_errors_total{source="crt.sh"}'
        values: '0+1x12'
      - series: 'argus_watch_source_errors_total{source="Cert Spotter"}'
        values: '0x12'
      - series: 'argus_watch_source_errors_total{source="Shodan"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 6h
        alertname: ArgusCertificateTransparencyDegraded
        exp_alerts:
          - exp_labels: {severity: info, source: crt.sh}
            exp_annotations:
              summary: crt.sh keeps failing for brand watches
              description: 5 or more failed look-ups in 6 hours. Brand watches carry on with the other source, but new lookalikes may be found late.
              runbook: crt.sh is often overloaded and usually recovers by itself; for Cert Spotter, a 429 means the free quota is used up - add ARGUS_CERTSPOTTER_API_KEY.

  - name: takedowns reported much faster than they are resolved build a backlog
    interval: 1d
    input_series:
      - series: 'argus_takedown_events_total{event="reported"}'
        values: '0+5x10'
      - series: 'argus_takedown_events_total{event="down"}'
        values: '0+1x10'
    alert_rule_test:
      - {eval_time: 2d, alertname: ArgusTakedownBacklog, exp_alerts: []}
      - eval_time: 9d
        alertname: ArgusTakedownBacklog
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: Takedown requests are piling up
              description: More than 20 more takedowns were reported than resolved this week - registrars or hosts are not acting on the abuse reports.
              runbook: Open the brand-protection report; the takedowns waiting longest are listed. Escalate to the registry, or report the domains to Google Safe Browsing and Microsoft SmartScreen.

  - name: balanced takedowns raise no backlog alert
    interval: 1d
    input_series:
      - series: 'argus_takedown_events_total{event="reported"}'
        values: '0+5x10'
      - series: 'argus_takedown_events_total{event="closed"}'
        values: '0+5x10'
    alert_rule_test:
      - {eval_time: 9d, alertname: ArgusTakedownBacklog, exp_alerts: []}

  - name: a restricted key used from another network raises an alert; an expired key does not
    interval: 1m
    input_series:
      - series: 'argus_auth_failures_total{reason="key_network"}'
        values: '0 0 0 1 1 1'
      - series: 'argus_auth_failures_total{reason="expired_key"}'
        values: '0 5 10 15 20 25'
    alert_rule_test:
      - {eval_time: 2m, alertname: ArgusApiKeyUsedOutsideItsNetworks, exp_alerts: []}
      - eval_time: 5m
        alertname: ArgusApiKeyUsedOutsideItsNetworks
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: An API key was presented from outside the networks it is allowed from
              description: A valid key restricted to certain networks was refused because the request came from elsewhere - the key may have leaked.
              runbook: Find the key and the address in the audit log (auth.failed, "outside its networks"); rotate the key if the address is not yours.
