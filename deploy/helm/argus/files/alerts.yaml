# Argus alerting rules (Prometheus rule-file format; also embedded in the chart's PrometheusRule).
# Each alert says what is wrong, why it matters and what to check first.
groups:
  - name: argus.availability
    rules:
      - alert: ArgusDown
        expr: absent(argus_build_info)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: No Argus replica is reporting metrics
          description: Prometheus has not scraped any Argus replica for 5 minutes. The service is down or unreachable.
          runbook: Check `kubectl get pods -l app.kubernetes.io/name=argus`, recent events and the readiness probe.

      - alert: ArgusDatabaseUnreachable
        expr: min(argus_database_up) == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Argus cannot reach PostgreSQL
          description: At least one replica's health check failed to query the database for 2 minutes; affected pods are out of the load balancer.
          runbook: Check database availability, credentials (database-url secret) and the NetworkPolicy databaseCIDRs.

      - alert: ArgusHighErrorRate
        expr: |
          sum(rate(argus_http_requests_total{status=~"5..",route!~"/api/health|/api/live|/metrics"}[5m]))
            / clamp_min(sum(rate(argus_http_requests_total{route!~"/api/health|/api/live|/metrics"}[5m])), 1e-9) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of API requests fail
          description: "{{ $value | humanizePercentage }} of API requests returned 5xx over the last 5 minutes."
          runbook: Search the JSON logs for level=error and correlate with request_id.

      - alert: ArgusSlowApi
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(argus_http_request_duration_seconds_bucket{route!~"/ws/.*|/metrics"}[5m]))) > 1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: API p95 latency above 1 second
          description: "95th percentile API latency is {{ $value | humanizeDuration }}."
          runbook: Check database latency (argus_checkpoint_duration_seconds), CPU throttling and running scan count.

  - name: argus.scans
    rules:
      - alert: ArgusScansFailing
        expr: |
          sum(increase(argus_scans_finished_total{status="failed"}[1h]))
            / clamp_min(sum(increase(argus_scans_finished_total[1h])), 1) > 0.25
          and sum(increase(argus_scans_finished_total[1h])) >= 4
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Over a quarter of scans failed in the last hour
          description: "{{ $value | humanizePercentage }} of finished scans failed."
          runbook: Open a failed investigation and read its errors; check argus_scans_interrupted_total for crashed replicas.

      - alert: ArgusReplicaLostScans
        expr: sum(increase(argus_scans_interrupted_total{reason="replica_unresponsive"}[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: A replica stopped responding while running scans
          description: "{{ $value }} scan(s) were failed because the replica running them stopped sending heartbeats."
          runbook: Look for OOMKilled or evicted pods; consider raising memory limits.

      - alert: ArgusCheckpointsFailing
        expr: sum(increase(argus_checkpoint_failures_total[10m])) > 5
        labels: {severity: warning}
        annotations:
          summary: Running scans cannot save their progress
          description: Checkpoints or heartbeats are failing; other replicas may wrongly treat these scans as crashed.
          runbook: Check database health and connection limits.

      - alert: ArgusAtScanCapacity
        expr: max(argus_cluster_scans_running) >= max(argus_scan_capacity)
        for: 30m
        labels: {severity: info}
        annotations:
          summary: The cluster has been at its concurrent-scan limit for 30 minutes
          description: New scans are being refused with HTTP 429. Raise config.maxConcurrentScans if the database can take it.

  - name: argus.sources
    rules:
      - alert: ArgusDataSourceDown
        expr: sum by (module) (increase(argus_module_circuit_breaker_trips_total[1h])) >= 3
        labels: {severity: warning}
        annotations:
          summary: "Collector {{ $labels.module }} keeps tripping its circuit breaker"
          description: The module was disabled mid-scan 3+ times in an hour - its upstream API is probably down, rate-limiting or has changed.
          runbook: Check the module's errors in recent investigations; verify API keys and quotas.

      - alert: ArgusSourcesThrottling
        expr: sum(rate(argus_outbound_requests_total{outcome="throttled"}[15m])) > 0.2
        for: 15m
        labels: {severity: info}
        annotations:
          summary: OSINT sources are rate-limiting Argus
          description: Scans slow down while Argus backs off; add API keys or lower concurrency.

  - name: argus.watches
    rules:
      - alert: ArgusWatchesFailing
        expr: |
          sum by (kind) (increase(argus_watch_runs_total{status="error"}[6h])) >= 3
            unless sum by (kind) (increase(argus_watch_runs_total{status=~"ok|partial"}[6h])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Every {{ $labels.kind }} watch run failed for 6 hours"
          description: "{{ $labels.kind }} watch runs keep failing and none succeeded - new lookalike domains or attacker servers are not being found."
          runbook: Open Monitoring > Brand watches (or Fingerprint watches); each watch shows its last error. Check the Shodan/Censys/Cert Spotter keys and that Argus can reach the source through its egress.

      - alert: ArgusWatchesStalled
        expr: time() - max by (kind) (argus_watch_last_success_timestamp_seconds) > 2 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "No {{ $labels.kind }} watch has succeeded for 2 days"
          description: "No replica has finished a {{ $labels.kind }} watch run successfully for 2 days - the watcher may have stopped."
          runbook: Check that monitoring is enabled for the plan and that the watcher loop is running (look for "watch tick failed" in the JSON logs).

      - alert: ArgusCertificateTransparencyDegraded
        expr: sum by (source) (increase(argus_watch_source_errors_total{source=~"crt.sh|Cert Spotter"}[6h])) >= 5
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.source }} keeps failing for brand watches"
          description: "5 or more failed look-ups in 6 hours. Brand watches carry on with the other source, but new lookalikes may be found late."
          runbook: crt.sh is often overloaded and usually recovers by itself; for Cert Spotter, a 429 means the free quota is used up - add ARGUS_CERTSPOTTER_API_KEY.

      - alert: ArgusTakedownBacklog
        expr: |
          (sum(increase(argus_takedown_events_total{event="reported"}[7d])) or vector(0))
            - (sum(increase(argus_takedown_events_total{event=~"down|closed"}[7d])) or vector(0)) > 20
        labels: {severity: info}
        annotations:
          summary: Takedown requests are piling up
          description: More than 20 more takedowns were reported than resolved this week - registrars or hosts are not acting on the abuse reports.
          runbook: Open the brand-protection report; the takedowns waiting longest are listed. Escalate to the registry, or report the domains to Google Safe Browsing and Microsoft SmartScreen.

  - name: argus.notifications
    rules:
      - alert: ArgusNotificationsFailing
        expr: sum by (channel_type) (increase(argus_notifications_total{outcome="failed"}[30m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Argus gave up delivering {{ $labels.channel_type }} notifications"
          description: Alerts were not delivered after every retry - people relying on this destination are not being told about attack-surface changes.
          runbook: Open Monitoring > Notifications in the affected workspace; the delivery log shows the error (revoked webhook, wrong URL, SMTP credentials). Fix it, then Retry.

      - alert: ArgusNotificationBacklog
        expr: max(argus_notifications_pending) > 50
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Notifications are piling up
          description: "{{ $value }} deliveries are waiting - a destination is down or the dispatcher is not running."
          runbook: Check the delivery log for the failing destination and that ARGUS_NOTIFICATIONS_ENABLED is true on at least one replica.

  - name: argus.security
    rules:
      - alert: ArgusAuthFailureSpike
        expr: sum(rate(argus_auth_failures_total{reason=~"invalid_key|websocket_ticket|metrics_token"}[5m])) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Many invalid credentials presented - possible key guessing
          description: "{{ $value | humanize }} rejected credentials per second. Invalid-key attempts are also in the audit log (auth.failed)."
          runbook: Review `/api/audit?action=auth.failed`, block the source at the ingress, rotate any leaked key.

      - alert: ArgusApiKeyUsedOutsideItsNetworks
        expr: sum(increase(argus_auth_failures_total{reason="key_network"}[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: An API key was presented from outside the networks it is allowed from
          description: A valid key restricted to certain networks was refused because the request came from elsewhere - the key may have leaked.
          runbook: Find the key and the address in the audit log (auth.failed, "outside its networks"); rotate the key if the address is not yours.

      - alert: ArgusAuditStreamFailing
        expr: |
          sum(increase(argus_audit_stream_events_total{outcome="failed"}[30m])) > 0
            unless sum(increase(argus_audit_stream_events_total{outcome="sent"}[30m])) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: The audit log is not reaching the SIEM
          description: Every attempt to forward audit entries failed for 30 minutes. Nothing is lost - entries wait at the stream's checkpoint - but the SIEM is blind to what happens in Argus until it recovers.
          runbook: Settings > Audit log streams shows the last error; check the Splunk or Sentinel destination's credentials in Monitoring > Notifications.

      - alert: ArgusEgressBlocked
        expr: sum(increase(argus_outbound_requests_total{outcome="blocked"}[15m])) > 0
        labels: {severity: info}
        annotations:
          summary: Argus refused to contact a private or metadata address
          description: The SSRF guard blocked an outbound request (e.g. a target redirecting to an internal address). Usually a hostile or misconfigured target - worth a look.
          runbook: Find the investigation in the JSON logs (outcome=blocked) and review its target.
