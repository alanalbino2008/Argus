# Prometheus + Grafana for the clustered Compose deployment:
#
#   docker compose -f deploy/compose/cluster.yml -f deploy/compose/observability.yml up -d
#
# Grafana: http://localhost:3000 (admin / $GRAFANA_ADMIN_PASSWORD) - "Argus OSINT" dashboard.
# Prometheus: http://localhost:9090 - alerts under Status > Rules / Alerts.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../helm/argus/files/alerts.yaml:/etc/prometheus/rules/argus.yaml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/argus-dashboard.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../helm/argus/files/argus-dashboard.json:/var/lib/grafana/dashboards/argus-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  prometheus-data:
  grafana-data:
