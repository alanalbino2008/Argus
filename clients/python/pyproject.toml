[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-client"
version = "1.34.0"
description = "Official Python client for the Argus attack surface intelligence API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25"]
license = { text = "Proprietary" }

[tool.setuptools]
packages = ["argus_client"]
