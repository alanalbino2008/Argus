[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-osint"
dynamic = ["version"]
authors = [
    { name = "Argus Intelligence", email = "security@argus.local" }
]
description = "Next-Generation Open Source Intelligence (OSINT) Platform & Graph Correlation Engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "networkx>=3.2.0",
    "aiohttp>=3.9.0",
    "dnspython>=2.6.0",
    "rich>=13.7.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[tool.setuptools.dynamic]
version = { attr = "argus.__version__" }  # single source of truth: argus/__init__.py

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
argus = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/*", "storage/migrations/*.mako"]

[project.scripts]
argus = "argus.cli.console:cli_entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ----------------------------------------------------------------------------- quality tooling
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["argus/web/vendor"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # import sorting
    "B",             # bugbear: likely bugs
    "UP",            # modern Python syntax
    "SIM", "C4", "PERF", "FLY",
    "ASYNC",         # asyncio pitfalls (blocking calls in coroutines...)
    "S",             # bandit: security smells
    "BLE",           # blind `except Exception`
    "RUF",
    "PT",            # pytest style
]
ignore = [
    "B008",    # FastAPI's Depends()/Query() in argument defaults is the framework's idiom
    "S311",    # `random` is used for retry jitter, never for security
    "E501",    # long lines are handled by the formatter where it can
]

[tool.ruff.lint.per-file-ignores]
# asserts, fake secrets, compound assertions and fake-module class attributes are fine in tests
"tests/**" = ["S101", "S104", "S105", "S106", "BLE001", "ASYNC230", "PT018", "RUF012"]
# Collectors deliberately isolate each data source's failure (reported via report_error),
# and declare their capabilities as class attributes.
"argus/modules/**" = ["BLE001", "RUF012"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["networkx.*", "dns.*", "rich.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["argus"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover", "raise NotImplementedError"]
