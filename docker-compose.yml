# Single node, SQLite on a volume:   docker compose up
# Clustered on PostgreSQL:           see deploy/compose/cluster.yml
#
# On first start an admin API key is generated and printed once (`docker compose logs argus`),
# or supply your own in an untracked .env file: ARGUS_BOOTSTRAP_ADMIN_KEY=argus_<long-random>

services:
  argus:
    build:
      context: .
      dockerfile: Dockerfile
    image: argus-osint:local
    container_name: argus-osint
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      ARGUS_DATABASE_URL: sqlite+aiosqlite:////app/data/argus.db
      ARGUS_BOOTSTRAP_ADMIN_KEY: ${ARGUS_BOOTSTRAP_ADMIN_KEY:-}
      # Encrypts notification webhook URLs; created on first start. Back it up with the volume.
      ARGUS_ENCRYPTION_KEY: ${ARGUS_ENCRYPTION_KEY:-}
      ARGUS_ENCRYPTION_KEY_FILE: /app/data/encryption.key
      ARGUS_PUBLIC_URL: ${ARGUS_PUBLIC_URL:-http://localhost:8000}
      ARGUS_SMTP_HOST: ${ARGUS_SMTP_HOST:-}
      ARGUS_SMTP_USERNAME: ${ARGUS_SMTP_USERNAME:-}
      ARGUS_SMTP_PASSWORD: ${ARGUS_SMTP_PASSWORD:-}
      ARGUS_SMTP_FROM: ${ARGUS_SMTP_FROM:-argus@localhost}
    volumes:
      - argus-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  argus-data:
