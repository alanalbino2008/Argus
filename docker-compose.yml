version: '3.8'

services:
  argus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus-osint
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/modules')"]
      interval: 30s
      timeout: 10s
      retries: 3
