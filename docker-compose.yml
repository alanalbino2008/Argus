version: '3.8'

services:
  argus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus-osint
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # Default: SQLite on a named volume. For PostgreSQL install the `postgres` extra and use e.g.
      # ARGUS_DATABASE_URL=postgresql+asyncpg://argus:<password>@db:5432/argus
      - ARGUS_DATABASE_URL=sqlite+aiosqlite:////app/data/argus.db
    volumes:
      - argus-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  argus-data:
