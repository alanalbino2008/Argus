version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Moving the runtime to a new Python minor/major is a deliberate change: add that version to
      # the CI test matrix first. Patch-level base-image updates (security fixes) still come through.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
