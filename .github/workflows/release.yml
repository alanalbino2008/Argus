name: Release

# Push a tag like v1.4.0 (matching argus/__init__.py) to publish a release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      packages: write      # push the image to ghcr.io
      id-token: write      # keyless signing (Sigstore) and provenance
      attestations: write  # build provenance attestation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('argus/__init__.py').read()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != package version ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Test
        run: pip install -r requirements-dev.txt && pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Argus $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}

      # Supply chain: who built this image, from what, and what is in it. Verify before deploying:
      # see docs/explained/98-supply-chain-security.md.
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/argus@${DIGEST}"
      - name: Attest how the image was built (SLSA provenance)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/argus
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Software bill of materials (CycloneDX), attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -v "$PWD:/work" -v "$HOME/.docker:/root/.docker:ro" -w /work aquasec/trivy:0.56.2 image --format cyclonedx \
            --output "argus-${VERSION}-sbom.cdx.json" --no-progress "ghcr.io/${{ github.repository_owner }}/argus@${DIGEST}"
          gh release upload "$GITHUB_REF_NAME" "argus-${VERSION}-sbom.cdx.json"

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Publish the Helm chart (OCI registry) and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          helm package deploy/helm/argus --app-version "$VERSION" --destination chart-dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push chart-dist/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
          gh release upload "$GITHUB_REF_NAME" chart-dist/*.tgz
