name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege for every job unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint, incl. bandit security rules)
        run: ruff check argus tests clients packaging --output-format=github
      - name: Ruff (format)
        run: ruff format --check argus tests clients packaging
      - name: mypy
        run: mypy argus

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a stuck runner fails instead of hanging for hours
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Evidence-capture tests use the browser Argus ships (Chrome's headless shell), not the runner's
      # desktop Chrome, which can stall for over a minute on the runner's D-Bus before it starts.
      - name: Chrome headless shell (the browser Argus ships for evidence capture)
        run: |
          python packaging/desktop/fetch_browser.py "$RUNNER_TEMP/browser" linux64
          echo "ARGUS_CAPTURE_BROWSER=$RUNNER_TEMP/browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: pytest (coverage gate in pyproject.toml)
        run: pytest --cov=argus --cov-report=term --cov-report=xml --durations=5
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  test-postgres:
    name: Tests on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus -d argus_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt "asyncpg>=0.29"
      - name: Chrome headless shell (the browser Argus ships for evidence capture)
        run: |
          python packaging/desktop/fetch_browser.py "$RUNNER_TEMP/browser" linux64
          echo "ARGUS_CAPTURE_BROWSER=$RUNNER_TEMP/browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: pytest against PostgreSQL (incl. multi-replica coordination tests)
        env:
          ARGUS_TEST_DATABASE_URL: postgresql+asyncpg://argus:argus@localhost:5432/argus_test
        run: pytest -q --durations=5

  kubernetes:
    name: Kubernetes (Helm chart on kind)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Lint chart
        run: helm lint deploy/helm/argus --strict
      - name: Validate manifests against the Kubernetes API schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for values in "" deploy/helm/argus/ci/*.yaml; do
            echo "== ${values:-defaults}"
            helm template argus deploy/helm/argus ${values:+-f $values} \
              | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: Validate alerting rules (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/helm/argus/files:/rules:ro" \
            prom/prometheus:v3.1.0 check rules /rules/alerts.yaml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/helm/argus/files:/rules:ro" -w /rules \
            prom/prometheus:v3.1.0 test rules alerts.test.yaml
      - name: Dashboard is up to date with its generator
        run: |
          python3 deploy/observability/build_dashboard.py
          git diff --exit-code deploy/helm/argus/files/argus-dashboard.json
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: argus:ci
          cache-from: type=gha
      - uses: helm/kind-action@v1
        with:
          cluster_name: argus
      - name: Install the chart (2 replicas + PostgreSQL, network policies, read-only pods)
        run: |
          kind load docker-image argus:ci --name argus
          helm install argus deploy/helm/argus \
            --set image.repository=argus --set image.tag=ci --set image.pullPolicy=Never \
            --wait --timeout 6m
          kubectl get pods -o wide
          # A clean install has no crash-restarts (startup races between replicas would show here).
          restarts=$(kubectl get pods -l app.kubernetes.io/name=argus \
            -o jsonpath='{range .items[*]}{range .status.containerStatuses[*]}{.restartCount}{"\n"}{end}{range .status.initContainerStatuses[*]}{.restartCount}{"\n"}{end}{end}' \
            | awk '{s+=$1} END {print s+0}')
          echo "container restarts: $restarts"; test "$restarts" -eq 0
      - name: helm test (healthy, database reachable, traffic reaches several replicas)
        run: helm test argus --logs
      - name: Rolling restart under traffic (probed from inside the cluster, through the Service)
        run: |
          kubectl run probe --image=curlimages/curl:8.11.1 --restart=Never --command -- sh -c \
            'ok=0; bad=0; for i in $(seq 1 120); do if curl -fsS -m 3 -o /dev/null http://argus/api/live; then ok=$((ok+1)); else bad=$((bad+1)); fi; sleep 0.5; done; echo "ok=$ok failed=$bad"'
          kubectl wait --for=condition=Ready pod/probe --timeout 2m
          kubectl rollout restart deployment/argus
          kubectl rollout status deployment/argus --timeout 5m
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/probe --timeout 3m
          result=$(kubectl logs probe | tail -1); echo "$result"
          # maxUnavailable=0, readiness gates and a preStop drain keep the API serving throughout.
          failed=${result##*failed=}; test "$failed" -le 2
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all,networkpolicy,pdb
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/name=argus --all-containers --tail 100

  package:
    name: Build & clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pip install -r requirements-dev.txt && python -m build
      # Installing into an empty venv catches undeclared dependencies and missing package data,
      # which the test job cannot (it installs requirements.txt directly).
      - name: Install wheel into a clean virtualenv and boot the server
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          ARGUS_DATABASE_URL=sqlite+aiosqlite:////tmp/argus.db /tmp/clean/bin/argus --serve --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/vendor/cytoscape-3.28.1.min.js
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/js/main.js
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/js/views/overview.js
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: pip-audit (known CVEs in runtime and tooling dependencies)
        run: pip-audit -r requirements-dev.txt --strict
      - name: pip-audit of the exact versions shipped in the image (requirements.lock)
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict
      # The image installs requirements.lock, not pyproject.toml: a dependency added or changed in
      # pyproject.toml without re-locking would be missing from (or wrong in) the image.
      - name: requirements.lock matches pyproject.toml
        run: |
          pip install "uv==0.11.32"
          cp requirements.lock /tmp/check.lock
          uv pip compile pyproject.toml --extra postgres --generate-hashes --universal --python-version 3.12 \
            -o /tmp/check.lock -q
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/check.lock) \
            || { echo "::error::requirements.lock is stale: re-run the command at the top of the file"; exit 1; }

  docker:
    name: Docker image build & health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: argus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and wait for a healthy status
        run: |
          # As production runs it: read-only filesystem, no Linux capabilities, no privilege escalation.
          docker run -d --name argus -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges argus:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' argus)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs argus
          [ "$(docker inspect -f '{{.State.Health.Status}}' argus)" = healthy ]
      - name: Image must not contain secrets, source tree or git history
        run: |
          # Capture first: with pipefail, "! docker run ... | grep" would pass whatever the image held.
          found=$(docker run --rm --entrypoint sh argus:ci -c 'ls -a /app; ls -d /app/.git /app/.env /app/tests 2>/dev/null; true')
          echo "$found"
          ! echo "$found" | grep -qE '\.git|\.env|tests'
      - name: Image has no package installer (nothing can be installed into a running container)
        run: |
          found=$(docker run --rm --entrypoint sh argus:ci -c 'command -v pip pip3; python -m pip --version 2>/dev/null; true')
          echo "found: ${found:-nothing}"
          [ -z "$found" ]
      - name: An unsafe configuration refuses to start (production preflight)
        run: |
          set +e
          out=$(timeout 60 docker run --rm -e ARGUS_AUTH_ENABLED=false -e FORWARDED_ALLOW_IPS='*' argus:ci 2>&1)
          code=$?
          echo "$out" | grep -E "Preflight" || true
          [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && echo "$out" | grep -q "Preflight auth_disabled" \
            && echo "$out" | grep -q "Preflight trust_all_proxies"
      # Known vulnerabilities in everything inside the image: the base OS packages and every Python
      # package. A critical one with a fix available fails the build; accepted risks go in .trivyignore,
      # each with a reason and a review date.
      - name: Vulnerability scan of the image (fails on fixable critical CVEs)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work \
            aquasec/trivy:0.56.2 image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore --no-progress argus:ci
      - name: Software bill of materials of the image (CycloneDX)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work \
            aquasec/trivy:0.56.2 image --format cyclonedx --output sbom-image.cdx.json --no-progress argus:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom-image.cdx.json
          if-no-files-found: warn

  accessibility:
    name: Accessibility (axe, WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Playwright drives Chromium; axe-core is the accessibility engine. Both pinned.
      - name: Browser and axe-core
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      # Every page in light and dark, on a phone, and with the command palette and the "More" sheet open.
      # ARGUS_REQUIRE_A11Y turns a missing tool into a failure instead of a silently skipped test.
      - name: Every page against WCAG 2.1 A + AA
        env:
          ARGUS_REQUIRE_A11Y: "1"
        run: pytest -q tests/test_accessibility.py
